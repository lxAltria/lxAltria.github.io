# ---------------------------------------------------------------------------
# Publications -- generated from the previous research.html, then maintained
# here by hand. 90 records.
#
# Field reference
#   id            REQUIRED. Stable, kebab-case, never edited once set.
#                 Sync/dedup between this site and hipcastor-site keys on this,
#                 NOT on title (titles change between arXiv and camera-ready).
#   title         REQUIRED.
#   authors       REQUIRED. YAML list, in order, spelled as printed.
#                 Names are matched against _data/people.yml to decide
#                 bolding (you) and underlining (your students) automatically.
#                 Do NOT put <b>/<u>/<sup> in here.
#   date          REQUIRED. ISO 8601. Use the VENUE date (when the paper is
#                 presented/published), not the acceptance date -- otherwise
#                 IPDPS '25 files under 2024 when grouped by year. Announce
#                 acceptances in _data/news.yml instead. Drives ALL sorting.
#   type          conference | journal | workshop | preprint | poster
#   series        Short badge shown in the left column, e.g. "SC'26".
#   venue         Full proceedings / journal string, as printed.
#   location      Optional.
#   dates         Optional. Date range exactly as printed, e.g. 'Nov 14 - 19, 2021'.
#                 Rendered in place of the month/year derived from `date`.
#   acceptance    Optional, e.g. "23.6% (86/365)".
#   award         Optional, e.g. "Best Paper Award".
#   co_first      Optional list of names; renders a + marker and a footnote.
#   corresponding Optional list of names; renders a * marker and a footnote.
#   links         Optional map. Store BARE identifiers, not URLs:
#                   doi:   10.1145/3458817.3476179   -> https://doi.org/...
#                   arxiv: 2510.25143                -> https://arxiv.org/abs/...
#                 pdf / code / slides are full URLs.
#   projects      Optional list of project ids (prodm, crii, ...). Drives the
#                 Publications section on each project page.
#   selected      true -> also appears in the home page "Selected Publications".
#   exclude_from  Optional list, e.g. [group] to suppress from hipcastor-site
#                 even though a group member is an author. OVERRIDE ONLY --
#                 group membership is otherwise computed from `authors`.
#
# NOTE: the 9 journal records dated YYYY-01-01 had no month in the source HTML.
# Correct them when convenient; they sort within the right year either way.
# ---------------------------------------------------------------------------



