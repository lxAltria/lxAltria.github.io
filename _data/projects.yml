- id: oac-core-mitigating-artifacts
  title: "Collaborative Research: OAC Core: Mitigating Artifacts in Scientific Data Compressors with a Learning-Driven Framework"
  url: https://explorexploitq.github.io/OAC_Core_AI_Compressor/
  role: "Site PI"
  lead_pi: "Yang Zhang"
  sponsor: "NSF"
  amount: "$600K (my share $300K)"
  start: "2025-10"
  end: "2028-09"
  image: "/img/artifact.png"
  description: >-
    Error-controlled lossy compressors are widely used to manage the large amount of data 
    produced by scientific applications. Still, they may produce undesired compression 
    artifacts that distort both raw and post hoc data analytics. This project aims to bridge 
    the gap by developing a novel learning-driven framework to mitigate artifacts produced 
    by scientific lossy compressors. The success of this project is expected to improve the 
    integrity and quality of lossy-compressed scientific data significantly, thus 
    facilitating the use of existing lossy-compression frameworks for efficient data 
    storage, transmission, and analytics in scientific applications. This contributes to 
    scientific discoveries in a broad range of domains, including climatology, cosmology, 
    fusion energy science, and X-ray ptychography, as well as multiple aspects of research 
    and education in advanced cyberinfrastructure.

- id: career-data-polymorphism-fast
  title: "CAREER: Data Polymorphism: Enabling Fast and Adaptable Scientific Data Retrieval with Progressive Representations"
  url: /projects/career.html
  award_id: "2628472"
  prior_award_id: "2442627"
  role: "PI"
  lead_pi: "Xin Liang"
  sponsor: "NSF"
  amount: "$500K"
  start: "2025-07"
  end: "2030-06"
  image: "/img/datapoly.png"
  description: >-
    Scientific simulations and instruments are producing an unprecedented amount of data 
    that overwhelms the network and storage systems. These data have to be stored at remote 
    sites or moved to secondary storage for archival purposes due to the limited capacity in 
    high end parallel file systems. This poses grand challenges to fetching the data for 
    post hoc data analytics, as the data movement bandwidth across wide area networks or 
    from secondary systems is very limited. This project bridges this gap by developing 
    scalable software to realize data polymorphism, a novel paradigm that allows for 
    variable representations of the same data under different scenarios and use cases, to 
    enable on demand data provision with reduced data movement cost. The success of this 
    project is expected to significantly reduce the time needed to gain scientific insights 
    from data for a wide range of applications, thus advancing scientific discoveries in 
    domains including climatology, cosmology, fusion energy science, and ptychography. This 
    contributes to resolving a wide range of important societal problems, including weather 
    forecasting, galaxy surveys, electric generation, and material design. Furthermore, an 
    integrated education program is developed for workforce development and broadening 
    participation in advanced cyberinfrastructure.
  participants:
    - Xin Liang (PI)
    - Pu Jiao (GRA)
    - Mingze Xia (GRA)
    - Xuan Wu (GRA)
    - Wenbo Li (GRA)

- id: rii-track-4-nsf
  title: "RII Track-4: NSF: Scalable MPI with Adaptive Compression for GPU-based Computing Systems"
  url: /projects/rii.html
  award_id: "2327266"
  role: "PI"
  lead_pi: "Xin Liang"
  sponsor: "NSF"
  amount: "$280K"
  start: "2024-02"
  end: "2026-01"
  image: "/img/rii.png"
  description: >-
    This Research Infrastructure Improvement Track-4 EPSCoR Research Fellows project will 
    provide a fellowship to an Assistant professor and training for a graduate student at 
    the University of Kentucky Research Foundation. This work will be conducted in 
    collaboration with researchers at the Argonne National Laboratory (ANL). Message Passing 
    Interface (MPI) is the de facto standard to perform communication and scale applications 
    on high-performance computing systems. The performance of MPI is crucial to various 
    downstream applications, including scientific simulations, big data analytics, and 
    artificial intelligence. However, as the recent development of GPUs continues to outpace 
    that of commodity networks, large-size data transfer is becoming the major performance 
    bottleneck in state-of-the-art MPI libraries. This work aims to tackle this problem by 
    developing a performant and scalable MPI library through integrated data compression, 
    which is critical to fully exploit the power of current and next-generation computing 
    systems. The success of this project will allow for accelerated executions of scientific 
    code and data analytics, reducing the time to scientific insights for applications 
    running on large-scale GPU-based computing systems. This will help advance scientific 
    discoveries across a wide range of computer and computational disciplines. The 
    deliverables of this project will be made publicly accessible to the community to 
    enhance the research and engineering cyberinfrastructure in broader domains. In 
    addition, this project will contribute to the education and workforce development for 
    advanced cyberinfrastructure through the training of graduate students.
  participants:
    - Xin Liang (PI)
    - Xuan Wu (GRA)

- id: oac-core-topology-aware
  title: "Collaborative Research: OAC Core: Topology-Aware Data Compression for Scientific Analysis and Visualization"
  url: https://www.sci.utah.edu/~beiwang/topocompression/index.html
  role: "PI"
  lead_pi: "Xin Liang"
  sponsor: "NSF"
  amount: "$600K (my share: $200K)"
  start: "2023-09"
  end: "2027-08"
  image: "/img/topoz.png"
  description: >-
    Today's large-scale simulations are producing vast amounts of data that are 
    revolutionizing scientific thinking and practices. For instance, a fusion simulation can 
    produce 200 petabytes of data in a single run, while a climate simulation can generate 
    260 terabytes of data every 16 seconds with a 1 square kilometer resolution. As the 
    disparity between data generation rates and available I/O bandwidths continues to grow, 
    data storage and movement are becoming significant bottlenecks for extreme-scale 
    scientific simulations in terms of in situ and post hoc analysis and visualization. The 
    disparity necessitates data compression, which compresses large-scale simulations data 
    in situ, and decompresses data in situ and/or post hoc for analysis and exploration. On 
    the other hand, a critical step in extracting insight from large-scale simulations 
    involves the definition, extraction, and evaluation of features of interest. Topological 
    data analysis has provided powerful tools to capture features from scientific data in 
    turbulent combustion, astronomy, climate science, computational physics and chemistry, 
    and ecology. While lossy compression is leveraged to address the big data challenges, 
    most existing lossy compressors are agnostic of and thus fail to preserve topological 
    features that are essential to scientific discoveries. This project aims to research and 
    develop advanced lossy compression techniques and software that preserve topological 
    features in data for in situ and post hoc analysis and visualization at extreme scales. 
    The success of this project will promote scientific research on driving applications in 
    cosmology, climate, and fusion by enabling efficient and effective compression for 
    scientific data, and the impact scales to other science and engineering disciplines. 
    Furthermore, the research products of this project will be integrated into visualization 
    and parallel processing curricula, disseminated via research and training workshops, and 
    used to attract underrepresented students for broadening participation in computing.

- id: elements-prodm-developing-unified
  title: "Collaborative Research: Elements: ProDM: Developing A Unified Progressive Data Management Library for Exascale Computational Science"
  url: /projects/prodm.html
  award_id: "2628470"
  prior_award_id: "2311756"
  role: "PI"
  lead_pi: "Xin Liang"
  sponsor: "NSF"
  amount: "$600K (my share: $240K)"
  start: "2023-08"
  end: "2028-01"
  image: "/img/ProDM_overview.png"
  description: >-
    Effective management of scientific data produced by extreme-scale simulations and 
    instruments is crucial for advancing scientific discoveries. Due to the scale of data 
    and the diverse requirements of scientific analytics, there is a growing need to manage 
    data in a progressive manner, such that users can stream as much data as they need to 
    carry out their data analytics with reduced data movement and computation. However, 
    little effort has been put into creating robust and scalable cyberinfrastructure 
    services that link the recent algorithmic innovations in progressive methods with 
    scientific data analytics, leaving these capabilities inaccessible to scientists. This 
    project aims to develop a sustainable framework ProDM that supports the progressive 
    management of scientific data to facilitate its use in scientific applications. The 
    success of this project will enable new scientific research and novel findings by 
    providing a new way to manage and analyze data. Furthermore, outcomes of this project 
    will be delivered as publicly available software to enhance research 
    cyberinfrastructure, promote education and teaching, and broaden participation in 
    computing.
  participants:
    - Xin Liang (PI)
    - Pu Jiao (GRA)
    - Mingze Xia (GRA)
    - Xuan Wu (GRA)
    - Wenbo Li (GRA)

- id: cybertraining-pilot-workforce-development
  title: "Collaborative Research: CyberTraining: Pilot: Research Workforce Development for Deep Learning Systems in Advanced GPU Cyberinfrastructure"
  url: https://dlgpu-workshop.github.io/
  role: "Site PI"
  lead_pi: "Tong Shu"
  sponsor: "NSF"
  amount: "$300K (my share: $98K)"
  start: "2022-11"
  end: "2025-09"
  image: "/img/Platform.png"
  description: >-
    With the recent advancements in artificial intelligence, deep learning systems and 
    applications have become a driving force in multiple transdisciplinary domains. While 
    this evolution has been largely supported by the rapid improvements in advanced GPU 
    cyberinfrastructure, comprehensive training materials are generally absent that combine 
    application-driven deep learning techniques with the implementation of such techniques 
    using the GPU cyberinfrastructure. To fill in this gap, this project develops an online 
    workshop that comprises of a set of interdisciplinary cutting-edge training sessions 
    offered by six faculty members from five disciplines. With a focus on the latest 
    innovations in GPU-based deep learning systems and applications, this workshop fosters a 
    community of the next-generation cyberinfrastructure users and contributors, who can 
    use, develop, and improve advanced GPU cyberinfrastructure for their deep learning 
    research. Such training efforts enhance the knowledge of the deep learning and GPU 
    cyberinfrastructure workforce, and subsequently contribute to the solutions of important 
    scientific and societal problems, including hydrographic mapping in geography, space 
    environment nowcasting in aerospace, and autonomous driving and traffic monitoring in 
    transportation. The workshop will also attract trainees from underrepresented groups, 
    including minority students and researchers from rural areas.

- id: improving-quality-lossy-compression
  title: "Improving Quality of Lossy Compression by Feature Regeneration"
  role: "PI"
  lead_pi: "Xin Liang"
  sponsor: "ANL"
  amount: "$231K"
  start: "2022-10"
  end: "2025-09"
  image: "/img/feature_reg.png"
  description: >-
    This project will focus on improving the compression quality of scientific lossy data 
    compressors by exploring intelligent methods and parameter optimization strategies to 
    regenerate feature and mitigate artifacts. The goal is to i) study new techniques to 
    regenerate features and/or mitigate artifacts for scientific lossy data compressors; ii) 
    integrate the methods to improve the compression quality of SZ using parameter 
    optimizations; iii) evaluate and optimize the framework with ECP applications.

- id: crii-oac-quantities-interest
  title: "CRII: OAC: Enabling Quantities-of-Interest Error Control for Trust-Driven Lossy Compression"
  url: /projects/crii.html
  award_id: "2330367"
  prior_award_id: "2153451"
  role: "PI"
  lead_pi: "Xin Liang"
  sponsor: "NSF"
  amount: "$175K"
  start: "2022-06"
  end: "2025-03"
  image: "/img/nek_fp.png"
  description: >-
    Scientific simulations and instruments are producing data at volumes and velocities that 
    overwhelm network and storage systems. Although error-controlled lossy compressors have 
    been employed to mitigate these data issues, many scientists still feel reluctant to 
    adopt them because these compressors provide no guarantee on the accuracy of downstream 
    analysis results derived from raw data. This project aims to fill this gap by developing 
    a trust-driven lossy data compression infrastructure capable of strictly controlling the 
    errors in downstream analysis theoretically and practically to facilitate the use of 
    data reduction in scientific applications. Success of this project will promote the 
    progress of science in multiple disciplines via effective data reduction, and contribute 
    to resolving important societal problems including electric generation, weather 
    forecasting, material design, and transportation. Moreover, this project will contribute 
    to the growth and development of future generations of scientists and engineers through 
    educational and engagement activities, including development of new curriculum and 
    recruitment of K-12 students.
  participants:
    - Xin Liang (PI)
    - Pu Jiao (GRA)
    - Mingze Xia (GRA)
    - Xuan Wu (GRA)

- id: esamr-scalable-analytics-multi
  title: "ESAMR: Enabling Scalable Analytics using Multi-precision Refactoring"
  role: "PI"
  lead_pi: "Xin Liang"
  sponsor: "ORNL DRD"
  amount: "$640K"
  start: "2020-10"
  end: "2022-09"
  image: "/img/drd.png"
  description: >-
    The overarching goal of this project is to create a framework to enable efficient data 
    streaming from edge devices, on-demand data retrieval from storage systems, and 
    progressive, scalable data analytics on edge and high-performance computing (HPC) 
    platforms. To achieve this goal, our multiprecision refactoring framework will refactor 
    scientific data in a progressive fashion based on importance, and will be optimized on 
    ORNL’s accelerated nodes. The framework will offer on-demand accuracy to minimize data 
    movement, and time spent in analysis algorithms on edge and HPC resources. Although this 
    is a general framework, we will validate its effectiveness on CNMS data generated from 
    the scanning transmission electron microscopy and DCA++ simulation data generated on 
    Summit. Upon success, it can be utilized at other ORNL facilities such as SNS, HFIR, and 
    OLCF. The progressive data representation defined in this project (i.e., the refactored 
    data) is complementary to other important ORNL initiatives such as the Federated 
    Instrument Initiative and the Scalable Data Infrastructure for Science Initiative and 
    can be integrated in edge systems and distributed storage infrastructures to allow for 
    efficient and scalable data collection, storage, and sharing.

- id: sirius-2-science-driven
  title: "Sirius-2: Science-driven Data Management for Multitier Storage 2.0"
  url: https://csmd.ornl.gov/project/sirius-2-science-driven-data-management-multitier-storage-20
  role: "Senior Personnel"
  lead_pi: "Scott Klasky (ORNL)"
  sponsor: "DOE ASCR"
  amount: "$500K/year"
  start: "2020-10"
  end: "2025-09"
  image: "/img/sirius.png"
  description: >-
    The Sirius 2 project will create the capability to enable progressive analysis. To 
    accomplish this, we will build upon our approach that created the MultiGrid Adaptive 
    Reduction of Data (MGARD) framework, which was a novel approach to create a hierarchy of 
    grids to represent the original data, and then compress the grids in the hierarchy. In 
    this project, we will map the refactored data across a multitier storage system 
    according to the information content. This mapping will allow for both in situ and 
    post-processing analysis methods to progressively retrieve with increasing accuracy.

- id: rapids-2-scidac-institute
  title: "RAPIDS-2: A SciDAC Institute for Computer Science, Data, and Artifical Intelligence"
  url: https://rapids.lbl.gov
  role: "Senior Personnel"
  lead_pi: "Robert Ross (ANL)"
  sponsor: "DOE ASCR"
  amount: "$5.75M/year"
  start: "2020-10"
  end: "2025-09"
  image: "/img/rapids.jpg"
  description: >-
    The Department of Energy (DOE) has led the world in enabling large-scale 
    high-performance computing as an indispensable tool for scientific discovery in a broad 
    range of disciplines. Our newest generation of systems is not simply larger than past 
    systems – it brings distinct and novel challenges. These challenges arise from the 
    deepening of the memory hierarchy and inclusion of fast, nonvolatile storage within the 
    HPC system; the widening ratio of peak FLOPS to I/O bandwidth; and the increasing 
    ubiquity of computation accelerators. Moreover, the breadth of science performed on DOE 
    advanced computing resources is growing and new motifs of investigation are emerging, 
    including those involving experimental and observational data and artificial 
    intelligence (AI). To address these challenges, we propose the RAPIDS2 SciDAC Institute 
    for Computer Science, Data, and Artificial Intelligence.

- id: codar-co-design-center
  title: "CODAR: Co-design Center for Online Data Analysis and Redcution at the Exascale"
  url: https://www.researchgate.net/project/Co-design-Center-for-Online-Data-Analysis-and-Reduction
  role: "Researcher"
  lead_pi: "Ian Foster (ANL)"
  sponsor: "DOE ECP"
  amount: "$4M/year"
  start: "2016-10"
  end: "2023-09"
  image: "/img/codar.png"
  description: >-
    By 2024, computers are expected to compute at 10<sup>18</sup> operations per second but 
    write to disk only at 10<sup>12</sup> bytes/sec: a compute-to-output ratio 200 times 
    worse than on the first petascale systems. In this new world, applications must 
    increasingly perform online data analysis and reduction tasks that introduce 
    algorithmic, implementation, and programming model challenges that are unfamiliar to 
    many scientists and that have major implications for the design of various elements of 
    exascale systems. The goal of the Center for Online Data Analysis and Reduction at the 
    Exascale (CODAR) is to produce infrastructure for online data analysis and reduction; 
    provide valuable abstractions for implementing and customizing data analysis and 
    reduction methods; import, integrate, and develop essential libraries implemented using 
    these abstractions; incorporate the libraries into scientific applications and quantify 
    accuracy and performance; release software artifacts; construct application-oriented 
    case studies; document success stories and the process applied to obtain them; and 
    report on codesign trade-off investigations.

- id: adios-providing-framework-scientific
  title: "ADIOS: Providing A Framework For Scientific Data On Exascale Systems"
  url: https://github.com/ornladios/ADIOS2
  role: "Researcher"
  lead_pi: "Scott Klasky (ORNL)"
  sponsor: "DOE ECP"
  amount: "$1.5M/year"
  start: "2016-10"
  end: "2023-09"
  image: "/img/adios.png"
  description: >-
    Exascale architectures will have complex, heterogeneous memory hierarchies, ranging from 
    node-level caches and main memory all the way to persistent storage via the file system, 
    that applications need to effectively achieve their science goals. At the same time, 
    exascale applications are becoming more complex in their data flows, from multiscale and 
    multiphysics simulations that need to exchange data between separate codes to 
    simulations that invoke data analysis and visualization services to extract information 
    and render it to storing simulation output to the file system for later analysis. The 
    ADIOS project delivers a highly optimized coupling infrastructure that enables efficient 
    synchronous and asynchronous data exchanges to move data between multiple codes running 
    concurrently and to the different layers of the storage system.

- id: sz-fast-effective-parallel
  title: "SZ: Fast, Effective, Parallel Error-bounded Exascale Lossy Compression For Scientific Data"
  url: https://szcompressor.org
  role: "Research Intern"
  lead_pi: "Franck Cappello (ANL)"
  sponsor: "DOE ECP"
  start: "2016-10"
  end: "2023-09"
  image: "/img/sz.jpg"
  description: >-
    Long-running large-scale simulations and high-resolution, high-frequency instrument 
    detectors are generating extremely large volumes of data at a high rate. While reliable 
    scientific computing is routinely achieved at small scale, it becomes remarkably 
    difficult at exascale due to both an increased number of disruptions as the machines 
    become larger and more complex from, for example, component failures and the big data 
    challenge. The VeloC/SZ project addresses these challenges by focusing on ensuring high 
    reliability for long-running exascale simulations and reducing the data while keeping 
    important scientific outcomes intact.
