# Polaris Lab blurb, shown at the top of the Group page.
name: "Polaris Laboratory"
mission: "The mission of Performance Optimizations for LARge-scale cyberInfrastructure and Systems (Polaris) Laboratory is to develop high-performance and scalable middleware for large-scale data management, storage, and analytics on cutting-edge computing systems, which will advance multiple domains including scientific simulations, big data analytics, artificial intelligence, and quantum computing. Driven by the actual needs from various science applications, research in the Polaris lab aims to address the perform issues raised by the big data challenges in real-world applications via deep collaborations with computational scientists. The research products are widely used in multiple DOE laboratories and will be validated on current and next-generation supercomputers including Summit, Aurora, and Frontier."
