  text: "Xuan has received the <b>ACM-IEEE CS George Michael Memorial HPC Fellowships</b> that honors exceptional graduate students (up to three awardees and one honorable mention worldwide) in high performance computing, networking, storage, and large-scale data analysis. This is great achievement and shows recognition from the community. Big congratulations to Xuan! [<a href=\"https://awards.acm.org/hpc-fellows\">Announcement</a>]"

