<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="author" content="Xin Liang">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
{%- if page.noindex %}
<meta name="robots" content="noindex">
{%- endif %}

<!-- Favicon -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/img/favicon-192.png' | relative_url }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/img/apple-touch-icon.png' | relative_url }}">

<!-- Social link previews (Open Graph / Twitter Card) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Xin Liang — Oregon State University">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/img/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Xin Liang, Associate Professor, School of Electrical Engineering and Computer Science, Oregon State University">
<meta name="twitter:card" content="summary_large_image">

<!-- Bootstrap core CSS (local copy) -->
<link href="{{ '/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">
